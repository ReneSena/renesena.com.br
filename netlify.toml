[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # ID público do Umami Cloud (aparece no HTML de qualquer jeito, não é segredo)
  PUBLIC_UMAMI_WEBSITE_ID = "929626a3-d7b4-44b5-8388-df0680961086"

[[headers]]
  for = "/*"
  [headers.values]
    # o CSP principal vai em <meta> (gerado pelo Astro); frame-ancestors só funciona como cabeçalho
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# base de conhecimento do assistente (lida pela função /api/chat): pública, mas fora dos buscadores
[[headers]]
  for = "/assistente/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
